# TokenDesk 反向代理模板（放到 nginx，务必配 TLS 再对外）。
# 用两个子域分开管理端 / 客户端，避免客户碰到后台。

# ---- 客户兑换页（可对公网）----
server {
    listen 443 ssl http2;
    server_name pay.example.com;              # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;

    # 客户端不需要大上传
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8931;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;              # 订阅任务轮询
    }
}

# ---- 管理端（强烈建议仅内网 / IP 白名单 / 另加 basic auth）----
server {
    listen 443 ssl http2;
    server_name admin.example.com;            # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    # 只放行你的出口 IP（示例）
    allow 1.2.3.4;                            # ← 改成你的固定 IP
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8930;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

# http → https 跳转
server {
    listen 80;
    server_name pay.example.com admin.example.com;
    return 301 https://$host$request_uri;
}
